# Backward-compatible filename. This stack connects the bot to an external
# NodeLink v3 instance using NODELINK_* variables from .env (Lavalink API v4).
services:
  discord-bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - lauffy-data:/app/data

volumes:
  lauffy-data:
