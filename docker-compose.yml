services:
  discord-bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The bot reaches NodeLink over the internal Compose network.
      NODELINK_HOST: nodelink
      NODELINK_PORT: "2333"
      NODELINK_TLS: "false"
      NODELINK_API_VERSION: "4"
    depends_on:
      nodelink:
        condition: service_healthy
    volumes:
      - lauffy-data:/app/data

  nodelink:
    image: docker.io/performanc/nodelink:v3.3.0
    restart: unless-stopped
    environment:
      NODELINK_SERVER_HOST: "0.0.0.0"
      NODELINK_SERVER_PORT: "2333"
      NODELINK_SERVER_PASSWORD: ${NODELINK_PASSWORD:?Set NODELINK_PASSWORD in .env}
      NODELINK_LOGGING_LEVEL: ${NODELINK_LOGGING_LEVEL:-info}
      NODELINK_SPONSORBLOCK_ENABLED: ${NODELINK_SPONSORBLOCK_ENABLED:-false}
    volumes:
      - ./nodelink/config.js:/app/config.js:ro
    ports:
      # The API is published only on the local host. The bot uses the internal
      # network address above, so no public exposure is needed for playback.
      - "127.0.0.1:${NODELINK_EXPOSE_PORT:-2333}:2333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2333/version >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  lauffy-data:
